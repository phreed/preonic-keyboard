[workspace]
name = "preonic-keyboard"
version = "0.1.0"
description = "FreedBoard keyboard layout - A modern keyboard implementation with advanced modifier handling and multiple layers for ortholinear keyboards"
authors = ["FreedBoard Layout Team"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64", "osx-arm64", "linux-aarch64"]

[dependencies]
python = ">=3.8,<4"
ruby = ">=2.7"

[pypi-dependencies]
qmk = "*"

# Conditionally install asciidoctor dependencies based on platform
[target.linux-64.dependencies]
asciidoctor = "*"
[target.osx-64.dependencies]
asciidoctor = "*"
[target.osx-arm64.dependencies]
asciidoctor = "*"
[target.win-64.dependencies]
# On Windows, we'll use gem install instead

[tasks]

# === Core ===

[tasks.generate-phreedom]
cmd = "python scripts/gen-json-board.py"
description = "Compile src/freed-board.toml → gen/freed-board.json (QMK Configurator format)"

[tasks.generate-svg]
cmd = "python scripts/gen-vis-board.py gen/freed-board.json src/layout-templates/LAYOUT_ortho_5x12-template.svg"
depends-on = ["generate-phreedom"]
description = "Generate SVG layer visualizations in gen/keyboard_layers/"

[tasks.build-pdf]
cmd = "asciidoctor-pdf src/freed-board.adoc -o gen/freed-board.pdf"
description = "Build PDF documentation from src/freed-board.adoc"

[tasks.build-html]
cmd = "asciidoctor src/freed-board.adoc -o gen/freed-board.html"
description = "Build HTML documentation from src/freed-board.adoc"

[tasks.build-docs]
depends-on = ["build-pdf", "build-html"]
description = "Build documentation in both PDF and HTML formats"

[tasks.lint-config]
cmd = "qmk lint gen/freed-board.json"
description = "Lint gen/freed-board.json using the QMK CLI"

[tasks.compile-firmware]
cmd = "qmk compile gen/freed-board.json"
description = "Compile QMK firmware from gen/freed-board.json"

[tasks.flash-keyboard]
cmd = "qmk flash gen/freed-board.json"
description = "Flash keyboard firmware (requires a connected device)"

# === Composite ===

[tasks.build-all]
depends-on = ["ensure-dirs", "generate-svg", "build-pdf"]
description = "Generate SVGs and build PDF documentation"

[tasks.workflow]
depends-on = ["lint-config", "build-all", "compile-firmware"]
description = "Full pipeline: lint → build → compile"

# === Utility ===

[tasks.ensure-dirs]
cmd = "mkdir -p gen/keyboard_layers"
description = "Create output directories under gen/"

[tasks.clean]
cmd = [
    "rm -rf gen/keyboard_layers/*.svg",
    "rm -f gen/freed-board.pdf gen/freed-board.html",
    "rm -f *.bin *.hex *.elf *.map"
]
description = "Remove all generated files (SVGs, docs, firmware binaries)"

[tasks.check-qmk]
cmd = "qmk doctor"
description = "Verify QMK installation and environment"

[tasks.check-all]
depends-on = ["check-qmk", "lint-config"]
description = "Run all health checks"

[tasks.setup]
depends-on = ["ensure-dirs", "check-qmk"]
cmd = "echo 'Development environment is ready! Run: pixi run workflow'"
description = "Set up development environment and verify configuration"

[tasks.install-asciidoctor]
cmd = [
    "gem install asciidoctor",
    "gem install asciidoctor-pdf"
]
description = "Install AsciiDoctor and AsciiDoctor-PDF via gem (Windows / manual fallback)"

# === Validation ===

[tasks.validate-svg]
cmd = "python -c \"import os; files = [f for f in os.listdir('gen/keyboard_layers') if f.endswith('.svg')]; print(f'Found {len(files)} SVG files'); [print(f'  - {f}') for f in sorted(files)]\""
depends-on = ["generate-svg"]
description = "List generated SVG files and confirm count"

[tasks.info]
cmd = "qmk info gen/freed-board.json"
description = "Display keyboard configuration via qmk info"

[feature.dev.dependencies]
# Development-specific dependencies
black = "*"
flake8 = "*"

[feature.dev.tasks.format]
cmd = "black scripts/"
description = "Format Python scripts with black"

[feature.dev.tasks.lint-python]
cmd = "flake8 scripts/"
description = "Lint Python scripts with flake8"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
